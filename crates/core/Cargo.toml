[package]
name = "typst-hero-core"
version = "0.1.0"
edition = "2024"

[dependencies]
typst = "0.15.1"
typst-assets = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"

[features]
default = ["embedded-fonts"]
# Bundle Typst's fonts into the binary (server, tests). The browser build
# turns this off and downloads fonts separately.
embedded-fonts = ["typst-assets/fonts"]
