intro = """
`#if condition [this] else [that]` picks content based on a value. Conditions compare with `<`, `>`, `<=`, `>=`, `==` and `!=`.

The branches are content blocks, so they can hold any markup.
"""

task = [
  "Write the word the instructions call for, using `#if` on the score.",
